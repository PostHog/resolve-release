name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  HOG_VERSION: 0.3.0

jobs:
  # A job without `permissions: id-token: write` fails, except on a pull request from a fork, where
  # the action passes with empty outputs.
  without-oidc:
    name: Without an OIDC token (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve release
        id: release
        continue-on-error: true
        uses: ./
        with:
          hog-version: ${{ env.HOG_VERSION }}
          project-id: '1'

      - name: Check the outcome and that every output is empty
        env:
          OUTCOME: ${{ steps.release.outcome }}
          EXPECTED: ${{ github.event.pull_request.head.repo.fork && 'success' || 'failure' }}
          RELEASE_ID: ${{ steps.release.outputs.release-id }}
          RELEASE: ${{ steps.release.outputs.release }}
        run: |
          if [ "$OUTCOME" != "$EXPECTED" ]; then
            echo "::error::Expected the step to end in $EXPECTED without an OIDC token, got $OUTCOME"
            exit 1
          fi
          if [ -n "$RELEASE_ID" ] || [ -n "$RELEASE" ]; then
            echo "::error::Expected empty outputs without an OIDC token, got release-id '$RELEASE_ID'"
            exit 1
          fi

  # Installs hog on each runner type. A token request URL that refuses connections lets the action get
  # past the OIDC check, then hog fails at the exchange, after the download and checksum ran.
  install:
    name: Install hog (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-24.04 }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: darwin-arm64, os: macos-15 }
          - { name: darwin-x64, os: macos-15-intel }
          - { name: linux-x64-musl, os: ubuntu-24.04, container: 'alpine:3.21' }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 5
    steps:
      - name: Install bash, curl, jq and the C++ runtime hog needs
        if: matrix.container != ''
        run: apk add --no-cache bash curl jq libstdc++ libgcc

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve release
        id: release
        continue-on-error: true
        uses: ./
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: https://127.0.0.1:9/token
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: not-a-token
        with:
          hog-version: v${{ env.HOG_VERSION }}
          # Every archive of hog 0.3.0 the matrix installs, so the pin check passes on each of them.
          hog-sha256: |
            9dff37a41ec5bf947c190fc4760e95a051be9ea7744eb3d0f4a4e7be695674bc
            35a0a6de2dfd476e2e594002fa7eb5b90d3b2a2ec578983075706df1c1b5b038
            cb7caf2f18d5e9200ab840e8b07c3b4f5d98364a2ab0eac047500afd6d66c515
            3180c2b064fe5d2b325964d70e0bef7e706411ef7fe137d979a68163adabc5da
            e17bedaca87ef2d034a4c6a407d675f488a15171627f1482159b216f28c12096
          project-id: '1'

      - name: Check that hog runs
        shell: bash
        env:
          TARGET: ${{ matrix.name }}
        run: |
          set -euo pipefail
          hog="$RUNNER_TEMP/hog-$HOG_VERSION/hog"
          [ -f "$RUNNER_TEMP/hog-$HOG_VERSION/hog-$TARGET.tar.gz" ] || { echo "::error::The action didn't download the $TARGET archive"; ls "$RUNNER_TEMP/hog-$HOG_VERSION"; exit 1; }
          [ "$("$hog" --version)" = "$HOG_VERSION" ] || { echo "::error::hog doesn't run or isn't $HOG_VERSION"; exit 1; }

      # A dry run of process needs no login, and fails with worker_missing when hog-worker isn't next to hog.
      - name: Check that hog starts hog-worker
        shell: bash
        run: |
          set -euo pipefail
          hog="$RUNNER_TEMP/hog-$HOG_VERSION/hog"
          dist="$RUNNER_TEMP/dist"
          mkdir -p "$dist"
          printf 'console.log(1);\n//# sourceMappingURL=app.js.map\n' >"$dist/app.js"
          printf '{"version":3,"sources":["app.ts"],"names":[],"mappings":"AAAA"}' >"$dist/app.js.map"
          result=$(HOG_NO_UPDATE_CHECK=1 "$hog" error-tracking process "$dist" --dry-run -o json)
          jq -e '.symbolSets | length == 1' <<<"$result" >/dev/null || { echo "::error::hog planned no symbol set: $result"; exit 1; }

  # Pull requests from forks get no OIDC token, and PostHog trusts only this repository, so the job
  # that resolves a real release runs only when the test project is set.
  credentials:
    name: Check test project
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: Check for the test project
        id: check
        env:
          PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          FORK: ${{ github.event.pull_request.head.repo.fork || false }}
        run: |
          if [ -n "$PROJECT_ID" ] && [ "$FORK" != true ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Real release test skipped::Set the POSTHOG_PROJECT_ID variable, and run hog ci setup for this repository in that project, to resolve a real release in the test workflow."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

  resolve:
    name: Resolve a release (${{ matrix.os }})
    needs: credentials
    if: needs.credentials.outputs.available == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      id-token: write # lets hog get an OIDC token for PostHog
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # One release name per OS, because two jobs that create the same release at once can collide.
      - name: Resolve release
        id: release
        uses: ./
        with:
          hog-version: ${{ env.HOG_VERSION }}
          project-id: ${{ vars.POSTHOG_PROJECT_ID }}
          host: ${{ vars.POSTHOG_HOST }}
          release-name: resolve-release-test-${{ runner.os }}

      - name: Resolve release with a build number
        id: build
        uses: ./
        with:
          hog-version: ${{ env.HOG_VERSION }}
          project-id: ${{ vars.POSTHOG_PROJECT_ID }}
          host: ${{ vars.POSTHOG_HOST }}
          release-name: resolve-release-test-${{ runner.os }}
          release-version: ${{ github.event.pull_request.head.sha || github.sha }}
          build: '42'

      - name: Check the outputs
        env:
          RELEASE_ID: ${{ steps.release.outputs.release-id }}
          RELEASE_NAME: ${{ steps.release.outputs.release-name }}
          RELEASE_VERSION: ${{ steps.release.outputs.release-version }}
          RELEASE: ${{ steps.release.outputs.release }}
          HOG_PATH: ${{ steps.release.outputs.hog-path }}
          BUILD_RELEASE_ID: ${{ steps.build.outputs.release-id }}
          BUILD_RELEASE_VERSION: ${{ steps.build.outputs.release-version }}
          EXPECTED_NAME: resolve-release-test-${{ runner.os }}
          EXPECTED_VERSION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          uuid='^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          [ -n "$RELEASE_ID" ] || fail "No release id. Check the POSTHOG_PROJECT_ID variable and the trust policy, then the log of the resolve step."
          [[ "$RELEASE_ID" =~ $uuid ]] || fail "release-id '$RELEASE_ID' is not a UUID"
          [ "$RELEASE_NAME" = "$EXPECTED_NAME" ] || fail "release-name is '$RELEASE_NAME', expected '$EXPECTED_NAME'"
          [ "$RELEASE_VERSION" = "$EXPECTED_VERSION" ] || fail "release-version is '$RELEASE_VERSION', expected '$EXPECTED_VERSION'"
          jq -e --arg id "$RELEASE_ID" '.id == $id' <<<"$RELEASE" >/dev/null || fail "release JSON does not carry the release id"
          [ "$BUILD_RELEASE_VERSION" = "$EXPECTED_VERSION+42" ] || fail "release-version with a build is '$BUILD_RELEASE_VERSION', expected '$EXPECTED_VERSION+42'"
          [ "$BUILD_RELEASE_ID" != "$RELEASE_ID" ] || fail "a build number did not give a separate release"
          "$HOG_PATH" --version >/dev/null || fail "hog-path '$HOG_PATH' does not run"
