name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  HOG_VERSION: 0.1.0

jobs:
  without-oidc:
    name: Skip without an OIDC token (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve release
        id: release
        uses: ./
        with:
          hog-version: ${{ env.HOG_VERSION }}
          project-id: '1'

      - name: Check that every output is empty
        env:
          RELEASE_ID: ${{ steps.release.outputs.release-id }}
          RELEASE: ${{ steps.release.outputs.release }}
        run: |
          if [ -n "$RELEASE_ID" ] || [ -n "$RELEASE" ]; then
            echo "::error::Expected empty outputs without an OIDC token, got release-id '$RELEASE_ID'"
            exit 1
          fi

  # Pull requests from forks get no OIDC token, and PostHog trusts only this repository, so the job
  # that resolves a real release runs only when the test project is set.
  credentials:
    name: Check test project
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: Check for the test project
        id: check
        env:
          PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          FORK: ${{ github.event.pull_request.head.repo.fork || false }}
        run: |
          if [ -n "$PROJECT_ID" ] && [ "$FORK" != true ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Real release test skipped::Set the POSTHOG_PROJECT_ID variable, and run hog ci setup for this repository in that project, to resolve a real release in the test workflow."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

  resolve:
    name: Resolve a release (${{ matrix.os }})
    needs: credentials
    if: needs.credentials.outputs.available == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      id-token: write # lets hog get an OIDC token for PostHog
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # One release name per OS, because two jobs that create the same release at once can collide.
      - name: Resolve release
        id: release
        uses: ./
        with:
          hog-version: ${{ env.HOG_VERSION }}
          project-id: ${{ vars.POSTHOG_PROJECT_ID }}
          host: ${{ vars.POSTHOG_HOST }}
          release-name: resolve-release-test-${{ runner.os }}

      - name: Resolve release with a build number
        id: build
        uses: ./
        with:
          hog-version: ${{ env.HOG_VERSION }}
          project-id: ${{ vars.POSTHOG_PROJECT_ID }}
          host: ${{ vars.POSTHOG_HOST }}
          release-name: resolve-release-test-${{ runner.os }}
          release-version: ${{ github.event.pull_request.head.sha || github.sha }}
          build: '42'

      - name: Check the outputs
        env:
          RELEASE_ID: ${{ steps.release.outputs.release-id }}
          RELEASE_NAME: ${{ steps.release.outputs.release-name }}
          RELEASE_VERSION: ${{ steps.release.outputs.release-version }}
          RELEASE: ${{ steps.release.outputs.release }}
          HOG_PATH: ${{ steps.release.outputs.hog-path }}
          BUILD_RELEASE_ID: ${{ steps.build.outputs.release-id }}
          BUILD_RELEASE_VERSION: ${{ steps.build.outputs.release-version }}
          EXPECTED_NAME: resolve-release-test-${{ runner.os }}
          EXPECTED_VERSION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          uuid='^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          [ -n "$RELEASE_ID" ] || fail "No release id. Check the POSTHOG_PROJECT_ID variable and the trust policy, then the log of the resolve step."
          [[ "$RELEASE_ID" =~ $uuid ]] || fail "release-id '$RELEASE_ID' is not a UUID"
          [ "$RELEASE_NAME" = "$EXPECTED_NAME" ] || fail "release-name is '$RELEASE_NAME', expected '$EXPECTED_NAME'"
          [ "$RELEASE_VERSION" = "$EXPECTED_VERSION" ] || fail "release-version is '$RELEASE_VERSION', expected '$EXPECTED_VERSION'"
          jq -e --arg id "$RELEASE_ID" '.id == $id' <<<"$RELEASE" >/dev/null || fail "release JSON does not carry the release id"
          [ "$BUILD_RELEASE_VERSION" = "$EXPECTED_VERSION+42" ] || fail "release-version with a build is '$BUILD_RELEASE_VERSION', expected '$EXPECTED_VERSION+42'"
          [ "$BUILD_RELEASE_ID" != "$RELEASE_ID" ] || fail "a build number did not give a separate release"
          "$HOG_PATH" --version >/dev/null || fail "hog-path '$HOG_PATH' does not run"
