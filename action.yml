name: "PostHog/resolve-release"

description: "Create or find the PostHog error tracking release for a build with hog and the job's OIDC token, and output its id"

author: "PostHog"

branding:
  icon: tag
  color: white

inputs:
  hog-version:
    description: "The hog version to install, such as 0.3.0. The action downloads it from releases.posthog.com, or the GitHub release when that fails, and checks it against the SHA256SUMS of the GitHub release"
    required: true
  hog-sha256:
    description: "SHA-256 checksums of the hog archives the action may install, separated by spaces, commas or newlines, from the version's SHA256SUMS. List one per runner type the workflow uses. When set, the archive for the runner must be one of them, which pins the exact binary"
    required: false
  project-id:
    description: "PostHog project ID. Defaults to `projectId` in posthog.json, then HOG_PROJECT_ID"
    required: false
  host:
    description: "PostHog host URL. Defaults to `host` in posthog.json, then HOG_HOST, then the US cloud. For the EU cloud, set `https://eu.posthog.com`"
    required: false
  release-name:
    description: "Release name. If not provided, the action uses the repository name"
    required: false
  release-version:
    description: "Release version (e.g., 1.4.0 or a commit SHA). If not provided, the action uses the commit SHA, which on a pull request is the head commit of the pull request"
    required: false
  build:
    description: "Build number (e.g., 42). The release version becomes `<release-version>+<build>`, so each build number is a separate release. Without `release-version`, the build number alone is the version"
    required: false

outputs:
  release-id:
    description: "ID of the release. Give it to your app as the `POSTHOG_RELEASE_ID` environment variable. Empty when no release was resolved"
    value: ${{ steps.resolve.outputs.release-id }}
  release-name:
    description: "Name of the release in PostHog"
    value: ${{ steps.resolve.outputs.release-name }}
  release-version:
    description: "Version of the release in PostHog, including the build number when one was given"
    value: ${{ steps.resolve.outputs.release-version }}
  release:
    description: "The whole release as JSON. Read a field with `fromJSON(steps.<step-id>.outputs.release).<field>`"
    value: ${{ steps.resolve.outputs.release }}
  hog-path:
    description: "Path to the hog binary the action installed, so later steps can run it, for example to upload source maps. hog-worker, which hog needs for error tracking files, sits next to it. Empty when the action resolved nothing"
    value: ${{ steps.resolve.outputs.hog-path }}

runs:
  using: "composite"
  steps:
    - name: Resolve release
      id: resolve
      shell: bash
      env:
        HOG_VERSION: ${{ inputs.hog-version }}
        HOG_SHA256: ${{ inputs.hog-sha256 }}
        INPUT_PROJECT_ID: ${{ inputs.project-id }}
        INPUT_HOST: ${{ inputs.host }}
        INPUT_RELEASE_NAME: ${{ inputs.release-name }}
        INPUT_RELEASE_VERSION: ${{ inputs.release-version }}
        INPUT_BUILD: ${{ inputs.build }}
        FORK_PULL_REQUEST: ${{ github.event.pull_request.head.repo.fork || false }}
        # hog reads the branch, commit, and repository of the release from these variables, and
        # GITHUB_ACTIONS tells it to use the job's OIDC token. On a pull request, the default SHA is a
        # merge commit that exists in no branch, so the head commit and branch of the pull request
        # replace it. Runners that do not export these variables, such as Depot CI, get them from the
        # context.
        GITHUB_ACTIONS: "true"
        GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        GITHUB_REF_NAME: ${{ github.head_ref || github.ref_name }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
      run: bash "$GITHUB_ACTION_PATH/resolve.sh"
